                  value: "5432"
                - name: POSTGRESQL_PORT
                  value: "tcp://10.137.227.227:5432"
                - name: POSTGRESQL_PORT_5432_TCP_PROTO
                  value: "tcp"
          restartPolicy: OnFailure
